<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100e0c" />
    <!-- Charcoal tile, off-white broadcast ring, vermilion centre. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23100e0c'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23ece6dc' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23e5484d'/%3E%3C/svg%3E"
    />
    <link rel="preload" href="/fonts/Fraunces-normal-1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/JetBrainsMono-normal-2.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/PlusJakartaSans-normal-3.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="description" content="A reference web player for a SUB/WAVE internet radio station." />
    <title>SUB/WAVE — Web Player</title>
    <!-- Google Cast Web Sender SDK. The SDK calls __onGCastApiAvailable when it
         finishes loading (must be registered before the async script runs); the
         app gates its cast button on that signal. Unsupporting browsers never
         fire it, so there the cast button simply never renders. -->
    <script>
      window.__onGCastApiAvailable = function (isAvailable) {
        window.__castApiAvailable = isAvailable;
        window.dispatchEvent(new CustomEvent('cast-api-ready', { detail: isAvailable }));
      };
    </script>
    <script
      src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"
      async
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
