<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- LONGWAVE: unbleached paper browser chrome; dark chrome is also
         advertised so OS-level UI matches when the player runs dark. -->
    <meta name="theme-color" content="#f4f0e9" />
    <meta name="theme-color" content="#17140f" media="(prefers-color-scheme: dark)" />
    <!-- Theme before first paint: the saved choice wins, else the OS
         preference. React's useTheme owns the attribute from hydration on —
         this inline run only exists so there is no light flash on load. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('subwave-theme');
          var dark =
            saved === 'dark' ||
            (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) {
          /* default stays light */
        }
      })();
    </script>
    <!-- Paper tile, near-square corners, graphite broadcast ring, ember centre. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23f4f0e9'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2317140f' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23a63d1e'/%3E%3C/svg%3E"
    />
    <meta name="description" content="A reference web player for a SUB/WAVE internet radio station." />
    <title>SUB/WAVE — Web Player</title>
    <!-- Google Cast Web Sender SDK. The SDK calls __onGCastApiAvailable when it
         finishes loading (must be registered before the async script runs); the
         app gates its cast button on that signal. Unsupporting browsers never
         fire it, so there the cast button simply never renders. -->
    <script>
      window.__onGCastApiAvailable = function (isAvailable) {
        window.__castApiAvailable = isAvailable;
        window.dispatchEvent(new CustomEvent('cast-api-ready', { detail: isAvailable }));
      };
    </script>
    <script
      src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"
      async
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
